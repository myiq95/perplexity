<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>서재 — Premium Reader</title>
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
</head>
<body>
<div id="app">
  <!-- Library -->
  <section id="library" class="screen active">
    <header class="lib-head">
      <div>
        <h1>서재</h1>
        <p class="muted">읽던 책은 언제든 이어 읽을 수 있습니다</p>
      </div>
      <button id="settingsBtn" class="icon-btn" aria-label="설정">⚙</button>
    </header>

    <div class="quick-actions">
      <button class="action" id="pasteBtn">
        <span class="a-ico">✎</span><span><b>TXT 붙여넣기</b><small>텍스트를 직접 추가</small></span>
      </button>
      <button class="action" id="openBtn">
        <span class="a-ico">📂</span><span><b>파일 열기</b><small>TXT · DOCX · PDF · EPUB · MD · HTML</small></span>
      </button>
    </div>

    <div class="shelf-head"><h2>내 책</h2><span id="bookCount" class="pill">0</span></div>
    <div id="shelf" class="shelf"></div>
    <div id="emptyShelf" class="empty">
      <div class="empty-art">📚</div>
      <h3>아직 책이 없습니다</h3>
      <p>파일을 열거나 텍스트를 붙여넣어 서재를 채워보세요.</p>
    </div>
  </section>

  <!-- Reader -->
  <section id="reader" class="screen">
    <header class="reader-head">
      <button id="backBtn" class="icon-btn" aria-label="서재로">←</button>
      <div class="book-title" id="readerTitle">제목</div>
      <button id="tocBtn" class="icon-btn" aria-label="목차">☰</button>
    </header>

    <main id="page" class="page" tabindex="0"></main>

    <footer class="reader-foot">
      <button id="prevBtn" class="ghost">이전</button>
      <div class="progress"><div id="progressBar"></div></div>
      <button id="nextBtn" class="ghost">다음</button>
    </footer>
  </section>

  <!-- Island dock -->
  <nav id="dock" class="dock" aria-label="독서 도구">
    <button data-act="library" title="서재">🏠</button>
    <button data-act="bookmark" title="책갈피">🔖</button>
    <button data-act="toc" title="목차">☰</button>
    <button data-act="tts" title="읽어주기">🎧</button>
    <button data-act="settings" title="설정">⚙</button>
  </nav>

  <!-- Sheet -->
  <div id="sheet" class="sheet" aria-hidden="true">
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel">
      <div class="sheet-handle"></div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>
</div>

<input id="fileInput" type="file" accept=".txt,.docx,.pdf,.epub,.md,.markdown,.html,.htm" multiple hidden>
<dialog id="pasteDialog">
  <form method="dialog">
    <h3>TXT 붙여넣기</h3>
    <input id="pasteTitle" placeholder="제목" required>
    <textarea id="pasteText" placeholder="본문을 붙여넣으세요" required></textarea>
    <div class="dialog-actions">
      <button value="cancel" class="ghost">취소</button>
      <button value="ok" id="pasteSave" class="primary">서재에 추가</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
