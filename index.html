<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>서재 — Quiet Reading</title>
<meta name="description" content="읽던 문장을 잊지 않는 미니멀 독서 PWA">
<meta name="theme-color" content="#f4f1ec">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
</head>
<body>
<main id="app">

  <section id="library" class="screen active">
    <header class="lib-head">
      <div>
        <div class="eyebrow">Personal Library</div>
        <h1>읽는 <em>즐거움</em>,<br>다시 여기서.</h1>
        <p class="lib-sub">읽던 문장과 책갈피를 그대로 남겨, 언제든 이어 읽을 수 있는 나만의 조용한 독서 공간입니다.</p>
      </div>
      <button id="settingsBtn" class="icon-btn" aria-label="읽기 설정">⚙</button>
    </header>

    <div class="quick-actions">
      <button class="action" id="pasteBtn">
        <span class="a-ico">✎</span>
        <span><b>TXT 붙여넣기</b><small>텍스트를 직접 추가하기</small></span>
      </button>
      <button class="action" id="openBtn">
        <span class="a-ico">⌘</span>
        <span><b>파일 열기</b><small>TXT · DOCX · PDF · EPUB · MD · HTML</small></span>
      </button>
    </div>

    <div class="section-head">
      <h2>내 서재</h2>
      <span class="count"><b id="bookCount">0</b> BOOKS</span>
    </div>

    <div id="shelf" class="shelf"></div>

    <div id="emptyShelf" class="empty">
      <div class="empty-art">✦</div>
      <h3>아직 조용한 서재입니다</h3>
      <p>좋아하는 소설이나 문서를 추가해<br>나만의 독서 공간을 만들어 보세요.</p>
    </div>
  </section>

  <section id="reader" class="screen">
    <header class="reader-head">
      <button id="backBtn" class="icon-btn" aria-label="서재로 돌아가기">←</button>
      <div class="book-title" id="readerTitle">제목</div>
      <button id="tocBtn" class="icon-btn" aria-label="목차">☰</button>
    </header>

    <article id="page" class="page" tabindex="0"></article>

    <footer class="reader-foot">
      <button id="prevBtn" class="ghost">이전</button>
      <div class="progress"><div id="progressBar"></div></div>
      <button id="nextBtn" class="ghost">다음</button>
    </footer>
  </section>

  <nav id="dock" class="dock" aria-label="독서 도구">
    <button data-act="library" title="서재">⌂</button>
    <button data-act="bookmark" title="책갈피">⚑</button>
    <button data-act="toc" title="목차">☰</button>
    <button data-act="tts" title="읽어주기">◉</button>
    <button data-act="settings" title="설정">⚙</button>
  </nav>

  <div id="sheet" class="sheet" aria-hidden="true">
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel">
      <div class="sheet-handle"></div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>
</main>

<input id="fileInput" type="file" accept=".txt,.docx,.pdf,.epub,.md,.markdown,.html,.htm" multiple hidden>

<dialog id="pasteDialog">
  <form method="dialog">
    <h3>텍스트 추가</h3>
    <input id="pasteTitle" placeholder="책 제목" required>
    <textarea id="pasteText" placeholder="본문을 붙여넣으세요" required></textarea>
    <div class="dialog-actions">
      <button value="cancel" class="ghost">취소</button>
      <button value="ok" id="pasteSave" class="primary">서재에 추가</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
